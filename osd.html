<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: 'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace; font-weight: 700;
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";  /* Ziffern gleich breit -> keine Sprünge */
  }
  /* Sanftes Ein-/Ausblenden per CSS-Opacity: der urspruengliche Plan (DirectComposition-Visual-
     Opacity, GPU-getrieben ohne Web-Message-Latenz) scheiterte an E_NOINTERFACE (v1-DComp-Device,
     IDCompositionVisual3 braeuchte DCompositionCreateDevice3 - gleicher Fund wie bei der Deckkraft
     des Analyse-OSD). Startzustand (unsichtbar, NUR fuer das Anzeige-Overlay) setzt das Skript
     SYNCHRON beim Registrieren des 'osd-fade'-Listeners, nicht hier per CSS-Default - sonst
     koennte das einmalige erste 'osd-fade'(true) verloren gehen, falls das Skript beim allerersten
     Zeigen noch nicht fertig geladen war, und das Overlay bliebe dauerhaft unsichtbar (schlimmer
     als der Ausgangsfehler). 'osd-fade' (osdFadeVisual in main.cpp) schaltet Dauer + Zielwert um.
     Edit-Modus bleibt aussen vor (siehe osd-fade-Handler + body.edit unten). */
  body { transition: opacity .11s linear; }
  :root {
    --nv: #74e857; --amd: #ff8a1e; --val: #ffe100; --fps: #ffffff; --ft: #6fe86f;
    --accent: #74e857;              /* Akzentfarbe (überschreibbar per Config) */
    --panel-op: 0.55;
    /* Paket 1 (Paletten): Gruppenfarben FPS/Netz, Grenzwert-Farben, Eckenradius - alles per Config setzbar */
    --fpc: #4bd6ff; --netc: #c79bff; --warn: #ff9a1f; --crit: #ff4d4d; --radius: 10px;
  }
  /* ===== Grenzwerte: Wert faerbt sich ab der Warn-/Alarmschwelle, Alarm optional pulsierend ===== */
  /* Warnung = Orange (Standardwerte sind schon gelb - Gelb auf Gelb war unsichtbar), Alarm = Rot; dazu ein
     dezenter Farbhintergrund hinter dem Wert, damit der Zustand in jeder Palette erkennbar bleibt. */
  .v.warn, .num.warn, .gv.warn, [data-role="fps.fps"].warn { color: var(--warn) !important; }
  .v.crit, .num.crit, .gv.crit, [data-role="fps.fps"].crit { color: var(--crit) !important; }
  /* Der Zustand darf nicht an der Farbe allein haengen (Palette/eigene Farben koennen selbst orange sein):
     Warnung = dunkle Schrift auf gefuellter Warnfarbe, Alarm = weisse Schrift auf Alarmfarbe. Kein normaler
     Wert hat je einen gefuellten Hintergrund -> in jeder Palette sofort erkennbar. */
  .v.warn, .num.warn, [data-role="fps.fps"].warn { color: #141414 !important; background: var(--warn); text-shadow: none; border-radius: 4px; padding: 0 3px; margin: 0 -3px; }
  .v.crit, .num.crit, [data-role="fps.fps"].crit { color: #fff !important; background: var(--crit); text-shadow: 0 1px 1px rgba(0,0,0,.5); border-radius: 4px; padding: 0 3px; margin: 0 -3px; }
  /* Balkenfuellung: Warnung gestreift (Gruppenfarbe kann selbst orange sein, z. B. AMD), Alarm voll rot */
  .fill.warn { background: repeating-linear-gradient(45deg, var(--warn) 0 4px, color-mix(in srgb, var(--warn) 35%, #000) 4px 8px) !important; }
  .fill.crit { background: var(--crit) !important; }
  .ring.warn { stroke: var(--warn) !important; } .ring.crit { stroke: var(--crit) !important; }
  body.lim-pulse .crit { animation: osdPulse 1s ease-in-out infinite; }
  @keyframes osdPulse { 50% { opacity: .45; } }
  /* ===== Layout-Baukasten (body.lay-*) ===== */
  body.lay-nolabels .k, body.lay-nolabels .lbl, body.lay-nolabels .gl { display: none !important; }
  body.lay-nolabels .t-strip .nm, body.lay-nolabels .t-tiles .cap { display: none !important; }   /* Leiste/Kacheln: Gruppenname ist dort die Beschriftung */
  /* Schriftart (waehlbar, --osd-font per Config): gilt fuer das Panel in allen Designs, auch Terminal; Edit-Leiste bleibt Segoe UI */
  body.font-custom #panel, body.font-custom #panel .t-term { font-family: var(--osd-font) !important; }
  body.lay-nounits .osd i { display: none !important; }
  body.lay-icons .nv .name::before, body.lay-icons .nv .nm::before, body.lay-icons .nv .cap::before, body.lay-icons .k.nv::before, body.lay-icons .d.nv::before, body.lay-icons .tl.nv::before { content: '▣ '; }
  body.lay-icons .amd .name::before, body.lay-icons .amd .nm::before, body.lay-icons .amd .cap::before, body.lay-icons .k.amd::before, body.lay-icons .d.amd::before, body.lay-icons .tl.amd::before { content: '◩ '; }
  body.lay-icons .fps .name::before, body.lay-icons .fps .nm::before, body.lay-icons .fps .cap::before, body.lay-icons .k.fp::before, body.lay-icons .d.fps::before, body.lay-icons .tl.fps::before { content: '◔ '; }
  body.lay-icons .grp-net .name::before, body.lay-icons .grp-net .nm::before, body.lay-icons .grp-net .cap::before, body.lay-icons .grp-net .k::before, body.lay-icons .d.grp-net::before, body.lay-icons .tl.grp-net::before { content: '⇅ '; }
  body.lay-nosep .t-strip .seg + .seg { border-left: 0 !important; }
  body.lay-nosep .t-neon .grp { border-left-width: 0 !important; padding-left: 0 !important; }
  body.lay-nosep .t-tiles .tile { border-top-width: 0 !important; }
  body.lay-nosep .t-term .ln + .ln, body.lay-nosep .t-hud .m + .m { border-top: 0 !important; }
  body.lay-eckig #panel, body.lay-eckig .t-strip, body.lay-eckig .t-tiles .tile, body.lay-eckig .t-dots, body.lay-eckig .track, body.lay-eckig .fill { border-radius: 0 !important; }
  body.lay-pille #panel { border-radius: 22px !important; } body.lay-pille .t-strip, body.lay-pille .t-dots, body.lay-pille .t-tiles .tile { border-radius: 999px !important; }
  body.lay-glow #panel, body.lay-glow .t-strip, body.lay-glow .t-tiles .tile, body.lay-glow .t-dots { box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 38%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent) !important; }
  body.lay-dense .t-compact .grp, body.lay-dense .t-bar .grp, body.lay-dense .t-neon .grp { margin-bottom: 5px !important; }
  body.lay-dense .t-min #panel, body.lay-dense.theme-min #panel { gap: 2px !important; }
  body.lay-dense .t-bar .track { margin-bottom: 3px !important; } body.lay-dense .t-tiles { gap: 4px !important; } body.lay-dense .t-strip .seg { padding: 1px 9px !important; }
  body.lay-dense .t-term .ln { line-height: 1.15 !important; } body.lay-dense .t-hud .m { padding: 2px 0 !important; }
  /* Beschriftungs-Spans (Paket 1): Werte-Beschriftung in allen Designs als .k, damit lay-nolabels greift */
  .t-bar .row .k, .t-neon .row .k { opacity: .85; }
  /* Panel sitzt absolut in der gewählten Ecke; horizontale Themes zentrieren am Rand */
  #panel {
    position: absolute; margin: 18px; color: var(--c-main, #fff); --cr: main;   /* Rollenfarben: --c-main/--c-lbl/--c-unit nur gesetzt, wenn Palette/Nutzer sie vorgeben, sonst Design-Standard; --cr = Rolle fuer den Klick-Farbmodus */
    text-shadow: 0 1px 2px rgba(0,0,0,.9); font-variant-numeric: tabular-nums;
  }
  body.pos-tl #panel { top: 0;    left: 0; }
  body.pos-tr #panel { top: 0;    right: 0; }
  body.pos-bl #panel { bottom: 0; left: 0; }
  body.pos-br #panel { bottom: 0; right: 0; }
  body.pos-tc #panel { top: 0;    left: 50%; transform: translateX(-50%); }
  body.pos-bc #panel { bottom: 0; left: 50%; transform: translateX(-50%); }
  .osd i { font-style: normal; font-size: .6em; margin-left: 2px; opacity: .95; color: var(--c-unit, currentColor); --cr: unit; }
  .hidden { display: none !important; }

  /* ============================ THEMES ============================ */

  /* -------- KOMPAKT -------- */
  body.theme-compact #panel { width: 232px; padding: 13px 15px 14px;
    background: rgba(8,8,12,var(--panel-op)); border-radius: 10px; backdrop-filter: blur(2px); }
  .t-compact .grp { margin-bottom: 13px; } .t-compact .grp:last-child { margin-bottom: 0; }
  .t-compact .lbl { font-size: 11px; letter-spacing: .16em; color: var(--c-lbl, #8a8a8a); --cr: lbl; margin-bottom: 1px; }
  .t-compact .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .t-compact .name { font-size: 21px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-compact .big  { font-size: 21px; color: var(--c-main, var(--val)); --cr: main; flex: 0 0 auto; }
  .t-compact .row  { display: flex; justify-content: space-between; align-items: baseline; margin-top: 1px; }
  .t-compact .row .k { font-size: 15px; } .t-compact .row .v { font-size: 15px; color: var(--val); --cr: val; }
  .t-compact .nv .name, .t-compact .nv .row .k { color: var(--nv); --cr: nv; }
  .t-compact .amd .name, .t-compact .amd .row .k { color: var(--amd); --cr: amd; }
  .t-compact .fps .name { color: var(--fpc); --cr: fpc; } .t-compact .fps .big { font-size: 27px; color: var(--c-main, #fff); }
  .t-compact .track, .t-compact .stats { display: none; }
  .t-compact canvas { display: block; width: 100%; height: 42px; margin-top: 4px; }
  .t-compact .ftline { font-size: 13px; color: var(--c-lbl, #9a9a9a); --cr: lbl; margin-top: 5px; }
  .t-compact .ftline .v { color: var(--val); --cr: val; }

  /* -------- MINIMAL -------- */
  body.theme-min #panel { display: flex; flex-direction: column; gap: 7px; }
  .t-min .line { display: flex; align-items: baseline; gap: 9px; }
  .t-min .k { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
  .t-min .k.nv { color: var(--nv); --cr: nv; } .t-min .k.amd { color: var(--amd); --cr: amd; } .t-min .k.fp { color: var(--fpc); --cr: fpc; }
  .t-min .v { font-size: 24px; color: var(--c-main, #fff); --cr: main; } .t-min .v.big { font-size: 33px; }
  .t-min .sub { font-size: 15px; opacity: .85; } .t-min .sub .v { color: var(--val); --cr: val; }
  .t-min canvas, .t-min .track, .t-min .lbl { display: none; }

  /* -------- BALKEN -------- */
  body.theme-bar #panel { width: 244px; padding: 14px 15px;
    background: rgba(10,10,14,calc(var(--panel-op) + .07)); border-radius: 10px; border: 1px solid rgba(255,255,255,.06); }
  .t-bar .grp { margin-bottom: 14px; } .t-bar .grp:last-child { margin-bottom: 0; }
  .t-bar .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; gap: 8px; }
  .t-bar .name { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-bar .nv .name { color: var(--nv); --cr: nv; } .t-bar .amd .name { color: var(--amd); --cr: amd; } .t-bar .fps .name { color: var(--fpc); --cr: fpc; }
  .t-bar .big { font-size: 17px; color: var(--c-main, #fff); --cr: main; flex: 0 0 auto; } .t-bar .fps .big { font-size: 26px; }
  .t-bar .fps .big i { color: var(--c-unit, var(--fpc)); }
  .t-bar .lbl { display: none; }
  .t-bar .track { height: 7px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; margin-bottom: 7px; }
  .t-bar .fill { height: 100%; border-radius: 4px; transition: width .2s; }
  .t-bar .nv .fill { background: linear-gradient(90deg, color-mix(in srgb, var(--nv) 55%, #000), var(--nv)); --cr: nv; }
  .t-bar .amd .fill { background: linear-gradient(90deg, color-mix(in srgb, var(--amd) 55%, #000), var(--amd)); --cr: amd; }
  .t-bar .row { display: inline-flex; gap: 4px; margin-right: 12px; font-size: 13px; color: var(--c-lbl, #d6d6d6); --cr: lbl; }
  .t-bar .row .v { color: var(--val); --cr: val; } .t-bar .stats { margin-top: -2px; }
  .t-bar .fps .track, .t-bar .fps-rows { display: none; }
  .t-bar canvas { display: block; width: 100%; height: 40px; margin-top: 4px; }

  /* -------- NEON -------- */
  body.theme-neon #panel { width: 226px; padding: 13px 15px; background: rgba(6,8,16,calc(var(--panel-op) + .25));
    border-radius: 6px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent); }
  .t-neon .grp { margin-bottom: 12px; padding-left: 9px; border-left: 2px solid; }
  .t-neon .grp:last-child { margin-bottom: 0; }
  .t-neon .grp.nv { border-color: var(--nv); } .t-neon .grp.amd { border-color: var(--amd); } .t-neon .grp.fps { border-color: var(--fpc); }
  .t-neon .lbl { display: none; }
  .t-neon .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .t-neon .name { font-size: 16px; letter-spacing: .03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-neon .nv .name { color: var(--nv); --cr: nv; text-shadow: 0 0 8px color-mix(in srgb, var(--nv) 55%, transparent); }
  .t-neon .amd .name { color: var(--amd); --cr: amd; text-shadow: 0 0 8px color-mix(in srgb, var(--amd) 50%, transparent); }
  .t-neon .fps .name { color: var(--fpc); --cr: fpc; text-shadow: 0 0 8px color-mix(in srgb, var(--fpc) 50%, transparent); }
  .t-neon .big { font-size: 18px; color: var(--c-main, #fff); --cr: main; flex: 0 0 auto; } .t-neon .fps .big { font-size: 24px; }
  .t-neon .row { display: inline-flex; gap: 3px; margin-right: 10px; margin-top: 3px; font-size: 12.5px; color: var(--c-lbl, #cfd3da); --cr: lbl; }
  .t-neon .row .v { color: var(--val); --cr: val; } .t-neon .stats { margin-top: 1px; }
  .t-neon .track { display: none; } .t-neon canvas { display: none; }

  /* -------- LEISTE (horizontal) -------- */
  body.theme-strip #panel { margin: 14px; }
  .t-strip { display: flex; align-items: center; background: rgba(8,8,12,var(--panel-op));
    border-radius: 9px; padding: 8px 4px; backdrop-filter: blur(2px); }
  .t-strip .seg { display: flex; align-items: baseline; gap: 7px; padding: 2px 15px; }
  .t-strip .seg + .seg { border-left: 1px solid rgba(255,255,255,.14); }
  .t-strip .nm { font-size: 12px; letter-spacing: .06em; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-strip .nv .nm { color: var(--nv); --cr: nv; } .t-strip .amd .nm { color: var(--amd); --cr: amd; } .t-strip .fps .nm { color: var(--fpc); --cr: fpc; }
  .t-strip .m { font-size: 15px; color: var(--c-main, #fff); --cr: main; } .t-strip .m .v { color: var(--val); --cr: val; }
  .t-strip .fps .m { font-size: 20px; }
  .t-strip .lbl, .t-strip .track, .t-strip canvas { display: none; }

  /* -------- KACHELN (horizontal) -------- */
  body.theme-tiles #panel { margin: 14px; }
  .t-tiles { display: flex; gap: 8px; }
  .t-tiles .tile { background: rgba(8,8,12,calc(var(--panel-op) + .07)); border-radius: 9px; padding: 9px 14px; min-width: 92px; border-top: 2px solid; }
  .t-tiles .tile.nv { border-color: var(--nv); } .t-tiles .tile.amd { border-color: var(--amd); } .t-tiles .tile.fps { border-color: var(--fpc); }
  .t-tiles .cap { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--c-lbl, #9aa0aa); --cr: lbl; margin-bottom: 3px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-tiles .tile.nv .cap { color: var(--nv); --cr: nv; } .t-tiles .tile.amd .cap { color: var(--amd); --cr: amd; } .t-tiles .tile.fps .cap { color: var(--fpc); --cr: fpc; }
  .t-tiles .num { font-size: 24px; color: var(--c-main, #fff); --cr: main; line-height: 1; } .t-tiles .num .v { color: var(--val); --cr: val; font-size: .5em; }
  .t-tiles .tile.fps .num { font-size: 30px; }
  .t-tiles .sub { font-size: 11.5px; color: var(--c-lbl, #c4c8d0); --cr: lbl; margin-top: 4px; } .t-tiles .sub .v { color: var(--val); --cr: val; }
  .t-tiles .lbl, .t-tiles .track, .t-tiles canvas { display: none; }

  /* -------- TACHO (Ringanzeigen) -------- */
  body.theme-gauge #panel { padding: 12px 10px 8px; background: rgba(8,8,12,var(--panel-op)); border-radius: var(--radius); }
  .t-gauge { display: flex; flex-direction: column; align-items: center; gap: 6px; }   /* symmetrisch: Ringe in EINER Reihe, Restwerte zentriert darunter */
  .t-gauge .rings { display: flex; justify-content: center; gap: 6px 10px; }
  .t-gauge .g { display: flex; flex-direction: column; align-items: center; width: 78px; }
  .t-gauge svg { width: 68px; height: 68px; display: block; }
  .t-gauge .trk { fill: none; stroke: rgba(255,255,255,.13); stroke-width: 7; }
  .t-gauge .ring { fill: none; stroke: var(--gc); --cr: var(--crg); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .25s; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .t-gauge .gv { font-size: 17px; color: var(--c-main, #fff); --cr: main; margin-top: -46px; height: 46px; display: flex; align-items: center; } .t-gauge .gv i { font-size: .55em; }
  .t-gauge .gl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--gc); --cr: var(--crg); margin-top: 4px; white-space: nowrap; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
  .t-gauge .rest { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--c-lbl, #cfd3da); --cr: lbl; padding: 2px 4px 0; }
  .t-gauge .rrow { display: flex; gap: 12px; white-space: nowrap; }
  .t-gauge .rest .row .v { color: var(--val); --cr: val; } .t-gauge .rest .row .k { opacity: .8; }
  .t-gauge .lbl, .t-gauge .track, .t-gauge canvas { display: none; }

  /* -------- TERMINAL -------- */
  body.theme-term #panel { padding: 9px 12px; background: rgba(0,8,2,calc(var(--panel-op) + .3)); border: 1px solid rgba(96,200,96,.35); border-radius: 4px; }
  .t-term { position: relative; font-family: 'Consolas', 'Cascadia Mono', 'DejaVu Sans Mono', monospace; font-weight: 400; text-shadow: 0 0 6px rgba(120,255,120,.35); }
  .t-term::after { content: ''; position: absolute; inset: -9px -12px; pointer-events: none; border-radius: 4px;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
  body.lay-nosep .t-term::after { display: none; }
  .t-term .ln { font-size: 14px; line-height: 1.45; color: var(--c-main, #c8ffc8); --cr: main; white-space: nowrap; }
  .t-term .ln + .ln { border-top: 1px dotted rgba(96,200,96,.18); }
  .t-term .k { display: inline-block; min-width: 42px; color: var(--gc, #5fd35f); --cr: var(--crg); }
  .t-term .v { color: var(--c-main, #d8ffd8); --cr: main; } .t-term i { color: var(--c-unit, #7fb97f); }
  .t-term .cur::after { content: '▮'; color: var(--c-main, #7dff7d); margin-left: 6px; animation: osdBlink 1s steps(1) infinite; }
  @keyframes osdBlink { 50% { opacity: 0; } }
  .t-term .lbl, .t-term .track, .t-term canvas { display: none; }

  /* -------- PUNKTE (horizontal, fast unsichtbar) -------- */
  body.theme-dots #panel { margin: 14px; }
  .t-dots { display: flex; align-items: center; gap: 14px; background: rgba(8,8,12,calc(var(--panel-op) * .7)); border-radius: 999px; padding: 5px 14px; }
  .t-dots .d { display: flex; align-items: baseline; gap: 5px; font-size: 13px; color: var(--c-main, #f2f2f2); --cr: main; white-space: nowrap; }
  .t-dots .d::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--gc); align-self: center; box-shadow: 0 0 6px var(--gc); }
  .t-dots .d .v + .v { margin-left: 2px; } .t-dots .d i { font-size: .6em; opacity: .7; } .t-dots .k { font-size: 10px; color: var(--c-lbl, #9aa0aa); --cr: lbl; letter-spacing: .08em; }
  .t-dots .lbl, .t-dots .track, .t-dots canvas { display: none; }

  /* -------- HUD (Rahmenecken) -------- */
  body.theme-hud #panel { padding: 14px 18px 12px; background: rgba(6,10,14,calc(var(--panel-op) + .1)); border-radius: 0; }
  .t-hud { position: relative; min-width: 210px; }
  .t-hud::before, .t-hud::after { content: ''; position: absolute; width: 16px; height: 16px; border: 2px solid var(--accent); pointer-events: none; }
  .t-hud::before { left: -14px; top: -10px; border-right: 0; border-bottom: 0; }
  .t-hud::after { right: -14px; bottom: -8px; border-left: 0; border-top: 0; }
  .t-hud .m { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
  .t-hud .m + .m { border-top: 1px solid rgba(255,255,255,.07); }
  .t-hud .tl { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gc); --cr: var(--crg); }
  .t-hud .ln { height: 3px; background: rgba(255,255,255,.1); position: relative; overflow: hidden; }
  .t-hud .ln .fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--gc); --cr: var(--crg); transition: width .2s; }
  .t-hud .val { color: var(--c-main, #fff); --cr: main; font-size: 15px; min-width: 64px; text-align: right; } .t-hud .val i { color: var(--c-unit, #9aa0aa); }
  .t-hud .val.big { font-size: 20px; }
  .t-hud .sub { grid-column: 1 / -1; font-size: 11.5px; color: var(--c-lbl, #c4c8d0); --cr: lbl; padding-left: 56px; margin-top: -2px; } .t-hud .sub .v { color: var(--val); --cr: val; }
  .t-hud .lbl, .t-hud .track, .t-hud canvas { display: none; }

  /* -------- Live-Edit -------- */
  /* NORMALBETRIEB (kein Edit): das Fenster ist genau panelgross -> Panel fix oben-links
     mit 14px Rand. Die Bildschirm-Ecke macht allein die Fensterposition (Shell). !important,
     um die Theme-Zentrierung (Leiste/Kacheln) und pos-*-Regeln zu ueberschreiben. Im
     Edit-Modus (body.edit) greift das NICHT -> dort bleibt die Vollbild-Eckplatzierung. */
  body:not(.edit) #panel { position: static !important; margin: 14px !important;
    left: auto !important; right: auto !important; top: auto !important; bottom: auto !important; transform: none !important; }
  /* Designs OHNE feste Breite (Minimal, Leiste, Kacheln, Tacho, Terminal, Punkte, HUD): als static Block
     wuerden sie immer den ganzen Viewport fuellen -> reportBounds meldet Fensterbreite, die Shell setzt das
     Fenster darauf, und das Panel kann nie wieder schmaler werden (gemessen: Leiste = Monitorbreite).
     max-content = echte Inhaltsbreite, unabhaengig vom aktuellen (vielleicht zu kleinen) Fenster. */
  body:not(.edit).theme-min #panel, body:not(.edit).theme-strip #panel, body:not(.edit).theme-tiles #panel, body:not(.edit).theme-gauge #panel,
  body:not(.edit).theme-term #panel, body:not(.edit).theme-dots #panel, body:not(.edit).theme-hud #panel { width: max-content; }
  body.edit #panel { outline: 2px dashed #4f8ef7; outline-offset: 5px; cursor: move; }
  /* Edit-Fenster ist ein normales, immer sichtbares Fenster - vom neuen Fade-Standard
     (body{opacity:0}) und von jeder verirrten 'osd-fade'-Nachricht ausnehmen. */
  body.edit { opacity: 1 !important; transition: none !important; }
  /* ===== Live-Edit-Leiste: Lumora-Look (Glas-Panel, Sektionen, Akzent #4f8ef7) ===== */
  #editbar { display: none; position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    z-index: 10; flex-direction: column; gap: 10px; white-space: nowrap; padding: 13px 16px 11px;
    background: linear-gradient(180deg, rgba(24,27,38,.97), rgba(14,16,23,.97));
    border: 1px solid rgba(255,255,255,.10); border-radius: 14px;
    box-shadow: 0 18px 48px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(14px) saturate(1.2);
    color: #d8d8e2; font-family: 'Segoe UI','DejaVu Sans',sans-serif; font-weight: 400; font-size: 13px; text-shadow: none; }
  /* Akzent-Verlaufsrahmen (feiner Ring, oben links + unten rechts blau angehaucht) */
  #editbar::before { content: ''; position: absolute; inset: -1px; border-radius: 15px; padding: 1px;
    background: linear-gradient(125deg, rgba(79,142,247,.55), rgba(255,255,255,.10) 30%, rgba(255,255,255,.05) 70%, rgba(79,142,247,.4));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  body.edit #editbar { display: flex; animation: eb-in .22s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes eb-in { from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.97); }
                     to   { opacity: 1; transform: translateX(-50%) translateY(0)    scale(1); } }
  /* Leiste IMMER gegenueber vom OSD, damit sie es nie verdeckt (v.a. horizontale
     Themes, die oben/unten mittig sitzen): OSD oben -> Leiste unten und umgekehrt. */
  body.pos-tl #editbar, body.pos-tc #editbar, body.pos-tr #editbar { top: auto; bottom: 16px; }
  body.pos-bl #editbar, body.pos-bc #editbar, body.pos-br #editbar { top: 16px; bottom: auto; }
  #editbar b { color: #fff; font-weight: 600; }
  .eb-top { display: flex; align-items: stretch; gap: 0; }
  /* Sektionen als "Karten": Label OBEN, Kontrolle darunter, feine Trenner dazwischen */
  .eb-ctl { display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    gap: 8px; padding: 2px 18px 0; }
  .eb-ctl:first-child { padding-left: 4px; }
  .eb-ctl + .eb-ctl { border-left: 1px solid rgba(255,255,255,.07); }
  .eb-row { display: flex; align-items: center; gap: 9px; min-height: 34px; }
  .eb-lbl { color: #7e879c; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  /* Design-Pfeile: rund, weich, mit Druck-Feedback */
  .eb-arrow { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #e8eaf2;
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 0 2px;
    transition: background .15s, border-color .15s, transform .1s; }

  #ebOpacity::-webkit-slider-runnable-track { height: 4px; border-radius: 999px;

    border-radius: 5px; cursor: pointer; font-size: 11px; line-height: 1; padding: 0;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }

  /* Werte-Zeilen: dieselbe Formensprache wie das Board in den Einstellungen
     (Farbpunkt je Gruppe, feste Marke = im Overlay, gestrichelt = ausgeblendet,
     sichtbare Griffe), aber auf EINE Zeile je Gruppe verdichtet - ueber dem Spiel
     ist Hoehe knapp. Gezogen wird genauso: Marken innerhalb ihrer Zeile, ganze
     Gruppen am Griff links. */
  /* Zweite Zeile: Form + Darstellungsschalter - dieselben Optionen wie Karte 1 im Einstellungsreiter,

  .eb-lay { display: flex; align-items: stretch; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.08); }
  .eb-lay .eb-ctl { justify-content: flex-start; }   /* Form oben neben der (zweizeiligen) Darstellung, nicht unten haengend */
  .eb-seg { display: inline-flex; gap: 3px; padding: 3px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; min-height: 0; }

  .eb-seg button:hover, .eb-togs button:hover { color: #fff; background: rgba(79,142,247,.14); border-color: rgba(79,142,247,.7); }
  .eb-seg button.on { color: #fff; background: rgba(79,142,247,.32); border-color: #4f8ef7; }
  .eb-togs { gap: 5px; flex-wrap: wrap; max-width: 420px; }
  .eb-togs button { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); }
  .eb-togs button.on { color: #fff; background: rgba(79,142,247,.32); border-color: #4f8ef7; box-shadow: 0 0 8px rgba(79,142,247,.45), inset 0 0 4px rgba(79,142,247,.35); }
  .eb-seg button:disabled, .eb-togs button:disabled { opacity: .28; cursor: default; pointer-events: none; box-shadow: none; }   /* im Design ohne Wirkung */
  .eb-fields { display: flex; flex-direction: column; gap: 5px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
  .eb-frow { display: flex; align-items: center; gap: 7px; padding: 3px 5px; border-radius: 8px;
    border-left: 2px solid var(--gc, #666);
    transition: background .12s ease, opacity .12s ease, box-shadow .12s ease; }
  .eb-frow:hover { background: rgba(255,255,255,.03); }
  .eb-griff { cursor: grab; color: #626b7d; font-size: 12px; line-height: 1; letter-spacing: -2px;

  .eb-griff:hover { color: #dfe4ee; background: rgba(255,255,255,.07); }

    display: flex; align-items: center; gap: 5px; color: var(--gc, #e8eaf2); }
  .eb-grp::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 5px currentColor; }
  .eb-toks { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
  /* Aktive Marke: gefuellt, mit Griffpunkten - zieh-bar und als "wird gezeigt" lesbar */
  .eb-chip { display: inline-flex; align-items: center; gap: 5px;
    background: linear-gradient(180deg, rgba(95,155,249,.42), rgba(63,126,232,.26));
    border: 1px solid #4f8ef7; color: #fff; border-radius: 8px; padding: 3px 9px 3px 6px;
    font-size: 11px; cursor: grab; white-space: nowrap;
    box-shadow: 0 0 8px rgba(79,142,247,.4), inset 0 1px 0 rgba(255,255,255,.18);
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s, opacity .12s; }
  .eb-chip:active { cursor: grabbing; }
  .eb-chip .pkt { color: rgba(255,255,255,.55); font-size: 11px; letter-spacing: -2px; line-height: 1; }
  .eb-chip:hover .pkt { color: #fff; }
  /* Ausgeblendete Marke: gestrichelt, ein Klick holt sie zurueck */
  .eb-chip-aus { display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: 1px dashed rgba(255,255,255,.20); color: #8f97a8;
    border-radius: 8px; padding: 3px 9px; font-size: 11px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s; }
  .eb-chip-aus:hover { border-color: rgba(79,142,247,.75); border-style: solid; color: #eef1f8; background: rgba(79,142,247,.10); }
  .eb-leer { font-size: 10.5px; color: #6f7688; font-style: italic; }

  .eb-hint { color: #6f7688; font-size: 11px; text-align: center; padding-top: 2px; }
  .eb-hint b { color: #9aa2b5; font-weight: 600; }
  /* Fertig: Akzent-Verlauf mit sanftem Lift */
  #editDone::before { content: '✓'; margin-right: 7px; font-weight: 700; }
  #editDone { align-self: center; background: linear-gradient(180deg, #5f9bf9, #3f7ee8); color: #fff; border: 1px solid rgba(255,255,255,.18);
    border-radius: 9px; padding: 7px 18px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 18px;
    box-shadow: 0 4px 14px rgba(63,126,232,.4), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .12s, box-shadow .15s, filter .15s; }
  #editDone:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(63,126,232,.5), inset 0 1px 0 rgba(255,255,255,.25); }
  #editDone:active { transform: translateY(0) scale(.97); }
  /* ===== Klick-Farbmodus (Vorschau im Reiter + Live-Editor "Im Overlay anklicken"): Zeigen hebt alle Teile
     derselben Rolle hervor (Klasse cr-hl per JS aus der CSS-Rollenmarke --cr), Klick oeffnet den Farbwaehler ===== */
  body.cmode #panel { cursor: pointer !important; outline-color: #4f8ef7; }

  svg .cr-hl { outline: none !important; box-shadow: none; filter: drop-shadow(0 0 3px #4f8ef7) drop-shadow(0 0 1px #fff); }

    color: #fff; background: rgba(20,24,34,.96); border: 1px solid rgba(79,142,247,.75); box-shadow: 0 6px 18px rgba(0,0,0,.5); text-shadow: none; white-space: nowrap; }
  #crTip small { display: block; font-weight: 400; color: #9aa2b5; font-size: 10.5px; }

    background: linear-gradient(180deg, rgba(24,27,38,.98), rgba(14,16,23,.98)); border: 1px solid rgba(79,142,247,.55); box-shadow: 0 14px 34px rgba(0,0,0,.6); }
  #ebPick .pk-title { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: #e8eaf2; margin-bottom: 8px; }
  #ebPick .pk-title small { color: #7e879c; font-weight: 400; }

<script>
  // ===================== Konfiguration & Daten ==========================
  const UNIT = { load:'%', temp:'°C', power:'W', clock:'MHz', vram:'MB', ram:'MB', frametime:'ms' };
  const LABEL = { temp:'temp', power:'power', clock:'clock', vram:'VRAM', ram:'RAM' };
  const ALL = {
    gpu: ['load','temp','power','clock','vram'],
    cpu: ['load','temp','clock','power','ram'],
    fps: ['fps','frametime','graph'],
    net: ['rate','total'],
  };
  let cfg = { theme: 'bar', fields: JSON.parse(JSON.stringify(ALL)), accent: '#74e857', opacity: 0.55,
              palette: 'standard', colors: null, limits: { on: true, gpuTempWarn: 75, gpuTemp: 85, cpuTempWarn: 80, cpuTemp: 90, loadWarn: 85, load: 95, fpsMin: 60, fpsCrit: 30, pulse: true },
              layout: { labels: true, units: true, icons: false, sep: true, form: 'rund', glow: false, dense: false },
              font: '' };   // Standard-Design: Balken; font '' = Standardschrift (Consolas-Kette aus dem CSS)
  // Paletten (Paket 1): Gruppenfarben GPU/CPU/FPS/Netz, Nebenwertfarbe (val), Akzent. 'eigen' nimmt cfg.colors.
  // Rollenfarben main (Hauptwerte), lbl (Beschriftungen), unit (Einheiten) sind optional: fehlen sie, gilt der Design-Standard.
  const PALETTES = {
    standard: { nv: '#74e857', amd: '#ff8a1e', fpc: '#4bd6ff', netc: '#c79bff', val: '#ffe100', accent: '#74e857' },
    mono:     { nv: '#ffffff', amd: '#ffffff', fpc: '#ffffff', netc: '#ffffff', val: '#ffffff', accent: '#ffffff' },
    dezent:   { nv: '#9aa3ad', amd: '#9aa3ad', fpc: '#d0d4d8', netc: '#9aa3ad', val: '#e6e8ea', accent: '#9aa3ad' },
    pastell:  { nv: '#a8e6cf', amd: '#ffd3b6', fpc: '#dcedc1', netc: '#d4c1ec', val: '#fff5ba', accent: '#a8e6cf' },
    amber:    { nv: '#ffb000', amd: '#ff8c00', fpc: '#ffd166', netc: '#ffb000', val: '#ffcc33', accent: '#ffb000' },
    rgb:      { nv: '#00ff88', amd: '#ff3366', fpc: '#00ccff', netc: '#cc66ff', val: '#ffffff', accent: '#00ccff' },
  };
  function farben(pal) { pal = pal || cfg.palette; return pal === 'eigen' && cfg.colors ? Object.assign({}, PALETTES.standard, cfg.colors) : (PALETTES[pal] || PALETTES.standard); }
  function applyFarben(pal) {   // pal nur fuer die Hover-Vorschau der Paletten-Chips im Live-Editor (zeigt, speichert nichts)
    const p = farben(pal), r = document.documentElement.style;
    r.setProperty('--nv', p.nv); r.setProperty('--amd', p.amd); r.setProperty('--fpc', p.fpc); r.setProperty('--netc', p.netc); r.setProperty('--val', p.val);
    // Rollenfarben Hauptwerte/Beschriftungen/Einheiten: nur wenn Palette oder eigene Farben sie vorgeben, sonst Design-Standard (CSS-Fallback)
    for (const [k, v] of [['main', '--c-main'], ['lbl', '--c-lbl'], ['unit', '--c-unit']]) { if (/^#[0-9a-fA-F]{6}$/.test(p[k] || '')) r.setProperty(v, p[k]); else r.removeProperty(v); }
    r.setProperty('--accent', (pal || cfg.palette) === 'standard' && cfg.accent ? cfg.accent : p.accent);
  }
  const GC = { gpu: 'var(--nv)', cpu: 'var(--amd)', fps: 'var(--fpc)', net: 'var(--netc)' };   // Gruppenfarbe als CSS-Wert fuer neue Designs
  const GCK = { gpu: 'nv', cpu: 'amd', fps: 'fpc', net: 'netc' };   // Farbschluessel je Gruppe (= Rolle im Klick-Farbmodus)
  const gcs = cat => `--gc:${GC[cat]};--crg:${GCK[cat]}`;   // Inline-Style: Gruppenfarbe + Rollenmarke (CSS: --cr: var(--crg))
  // Fuer die Live-Edit-Leiste: Design-Namen + Kurzlabels der waehlbaren Werte
  const EB_THEMES = [['compact','Kompakt'],['min','Minimal'],['bar','Balken'],['neon','Neon'],['strip','Leiste'],['tiles','Kacheln'],['gauge','Tacho'],['term','Terminal'],['dots','Punkte'],['hud','HUD']];
  const HORIZ = ['strip','tiles','dots'];   // Designs, die beim Umstieg von alten Einstellungen auf 'mittig' wandern (Migration in index.html)
  // Welche Layout-Option in welchem Design ueberhaupt wirkt (gemessen am DOM/CSS je Design, 1.11.2026):
  // nur dann sind die Schalter im Live-Editor und im Einstellungsreiter anklickbar.
  // QUELLE DER WAHRHEIT - index.html (OSD_LAY_CAPS) ist eine Kopie und muss identisch bleiben.
  const LAY_CAPS = {
    compact: ['labels','units','icons','dense','form','glow'],
    min:     ['labels','units','icons','dense'],
    bar:     ['labels','units','icons','dense','form','glow'],
    neon:    ['labels','units','icons','sep','dense','form','glow'],
    strip:   ['labels','units','icons','sep','dense','form','glow'],
    tiles:   ['labels','units','icons','sep','dense','form','glow'],
    gauge:   ['labels','units','form','glow'],
    term:    ['labels','units','icons','sep','dense','form','glow'],
    dots:    ['labels','units','icons','form','glow'],
    hud:     ['labels','units','sep','dense','form','glow'],
  };
  function layCan(k) { return (LAY_CAPS[cfg.theme] || LAY_CAPS.bar).includes(k); }
  // Schriften zum Durchschalten im Live-Editor: Windows-Bordschriften (keine externen Dateien). Der Reiter
  // bietet zusaetzlich alle installierten Schriften (Shell: list-fonts) - eine davon erscheint hier nur als Name.
  const EB_FONTS = [['', 'Standard'], ['Cascadia Mono', 'Cascadia Mono'], ['Lucida Console', 'Lucida Console'], ['Courier New', 'Courier New'],
                    ['Segoe UI', 'Segoe UI'], ['Bahnschrift', 'Bahnschrift'], ['Verdana', 'Verdana'], ['Arial', 'Arial'], ['Impact', 'Impact']];
  const EB_PAL = [['standard','Standard'],['mono','Monochrom'],['dezent','Dezent'],['pastell','Pastell'],['amber','Amber'],['rgb','RGB-Gaming'],['eigen','Eigene Farben']];
  const EB_FLD = {
    gpu: [['load','Last'],['temp','Temp'],['power','Watt'],['clock','Takt'],['vram','VRAM']],
    cpu: [['load','Last'],['temp','Temp'],['clock','Takt'],['power','Watt'],['ram','RAM']],
    fps: [['fps','FPS'],['frametime','ms'],['graph','Graph']],
    net: [['rate','Rate'],['total','Summe']],
  };
  // Gruppenfarben identisch zum Board in den Einstellungen - dieselbe Zuordnung,
  // egal wo man konfiguriert. Frueher haingen die Farben an der ZEILENPOSITION
  // (:nth-child), womit die Netzwerk-Gruppe gar keine bekam und jede Umsortierung
  // die Farben mitwanderte.
  const EB_FARBE = { gpu: '#74e857', cpu: '#ff8a1e', fps: '#4bd6ff', net: '#c79bff' };
  let data = { gpu: null, cpu: null, fps: null, frametime: null, api: null, net: null };

  const panel = document.getElementById('panel');
  const has = (cat, f) => (cfg.fields[cat] || []).includes(f);
  const esc = s => String(s == null ? '' : s);

  // ---- Fenster-Groesse an den Panel-Inhalt melden -------------------------------------
  // Die Shell verkleinert das OSD-Fenster auf GENAU diese Flaeche (der WebView2-Inhalt
  // rendert weiter Vollbild, nur das Fenster + der DComp-Visual werden verschoben). Damit
  // deckt das Overlay nie mehr den ganzen Desktop ab und kann Desktop-Symbole nicht
  // blockieren - egal wie das Click-through auf dem jeweiligen System reagiert.
  // Im Edit-Modus NICHT melden (dort ist das Fenster absichtlich Vollbild + interaktiv).
  // Das Edit-Fenster (?editbg=1) meldet NIE Panel-Masse: vor dem 'osd-edit'-Signal ist 'editing'
  // dort noch false, und die Meldung (Standard-Design, noch ohne Config) landete als Fenstergroesse
  // des Anzeige-Overlays -> echtes Design nach 'Fertig' abgeschnitten.
  const IS_EDIT_WIN = /[?&]editbg=1/.test(location.search);
  function reportBounds() {
    if (!ipcRenderer || editing || IS_EDIT_WIN) return;
    const r = panel.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    const dpr = window.devicePixelRatio || 1, M = 14;   // Rand ums Panel (ersetzt das alte margin)
    const corner = ['tl','tc','tr','bl','bc','br'].find(c => document.body.classList.contains('pos-' + c)) || 'tl';
    const horiz = corner[1] === 'c';   // mittig -> Shell zentriert das Fenster horizontal
    const w = Math.ceil((r.width  + 2 * M) * dpr), h = Math.ceil((r.height + 2 * M) * dpr);
    // Hysterese: Designs mit Inhaltsbreite (Leiste, Punkte, ...) werden mit jeder Ziffer schmaler/breiter
    // (855 -> 1200 MHz). Wachsen sofort melden (sonst abgeschnitten), Schrumpfen erst ab 16 CSS-px -
    // sonst rueckt das zentrierte Fenster bei jedem Wert ein paar Pixel hin und her (gemessen: +-21 px).
    const key = corner + horiz;
    if (_lastB.key === key && h === _lastB.h && w <= _lastB.w && _lastB.w - w < 16 * dpr) return;
    _lastB = { key, w, h };
    ipcRenderer.invoke('osd-bounds', { w, h, corner, horiz });
  }
  let _lastB = { key: '', w: 0, h: 0 };
  let _rbRaf = 0;
  function scheduleBounds() { if (_rbRaf) return; _rbRaf = requestAnimationFrame(() => { _rbRaf = 0; reportBounds(); }); }
  try { new ResizeObserver(scheduleBounds).observe(panel); } catch (e) {}

  // ---- kleine HTML-Helfer ----
  // Wertspan mit data-role für Live-Updates: <span data-role="gpu.temp">–</span><i>°C</i>
  const val = (role, unit) => `<span class="v" data-role="${role}">–</span>${unit ? `<i>${unit}</i>` : ''}`;

  // ===================== Renderer je Theme ==============================
  function catList(cat) { return (cfg.fields[cat] || []); }

  function rowsFor(cat) {                 // Zeilen (ohne load/fps – die stehen im Kopf)
    const skip = cat === 'fps' ? ['fps','frametime','graph'] : ['load'];
    return catList(cat).filter(f => !skip.includes(f));
  }

  // Netz-Segment (Design je Theme wie die FPS-Gruppe; grp-net blendet die ganze
  // Gruppe aus, solange keine Zaehlung laeuft - sonst stuende dauerhaft ein "-"-Block).
  function netSeg(kind) {
    if (!catList('net').length) return '';
    const rate = has('net','rate'), total = has('net','total');
    if (!rate && !total) return '';
    if (kind === 'seg')   // Leiste
      return '<div class="seg fps grp-net"><span class="nm">NET</span>'
        + (rate ? '<span class="m" style="font-size:13px"><span data-role="net.rate">\u2013</span></span>' : '')
        + (total ? '<span class="m" style="font-size:13px"><span data-role="net.total">\u2013</span></span>' : '')
        + '</div>';
    if (kind === 'tile')  // Kacheln
      return '<div class="tile fps grp-net"><div class="cap">NET</div>'
        + '<div class="num" style="font-size:16px"><span data-role="net.rate">\u2013</span></div>'
        + (total ? '<div class="sub"><span data-role="net.total">\u2013</span></div>' : '')
        + '</div>';
    if (kind === 'line')  // Minimal
      return '<div class="line grp-net"><span class="k fp">NET</span>'
        + (rate ? '<span class="sub"><span data-role="net.rate">\u2013</span></span>' : '')
        + (total ? '<span class="sub"><span data-role="net.total">\u2013</span></span>' : '')
        + '</div>';
    // Standard: eigener Gruppenblock (Kompakt/Balken/Neon)
    let h = '<div class="grp fps grp-net"><div class="head"><span class="name">NET</span>';
    h += rate ? '<span class="big" style="font-size:14px"><span data-role="net.rate">\u2013</span></span></div>' : '<span></span></div>';
    if (total) h += '<div class="stats"><span class="row">' + '\u03a3 ' + '<span class="v" data-role="net.total">\u2013</span></span></div>';
    return h + '</div>';
  }

  // Reihenfolge der Gruppen: frei sortierbar (Einstellungen -> Overlay -> Werte).
  // Unbekannte/fehlende Eintraege haengen in der Standardreihenfolge hinten dran -
  // eine alte Konfiguration ohne gespeicherte Reihenfolge bleibt so unveraendert.
  function orderList() {
    const std = ['gpu','cpu','fps','net'];
    const o = Array.isArray(cfg.order) ? cfg.order.filter(c => std.includes(c)) : [];
    for (const c of std) if (!o.includes(c)) o.push(c);
    return o;
  }

  function buildCompact() {
    let h = '<div class="osd t-compact">';
    for (const cat of orderList()) {
      if (cat === 'net') { h += netSeg('grp'); continue; }
      if (!catList(cat).length) continue;
      h += `<div class="grp ${cat === 'gpu' ? 'nv' : cat === 'cpu' ? 'amd' : 'fps'}">`;
      if (cat !== 'fps') {
        h += `<div class="lbl" data-role="${cat}.brand">–</div>`;
        h += `<div class="head"><span class="name" data-role="${cat}.name">–</span>`;
        h += has(cat,'load') ? `<span class="big">${val(cat+'.load','%')}</span></div>` : `<span class="big"></span></div>`;
        for (const f of rowsFor(cat)) h += `<div class="row" data-row="${cat}.${f}"><span class="k">${LABEL[f]}</span><span>${val(cat+'.'+f, UNIT[f])}</span></div>`;
      } else {
        h += `<div class="head"><span class="name">FPS</span>`;
        h += has('fps','fps') ? `<span class="big"><span data-role="fps.fps">–</span></span></div>` : `<span></span></div>`;
        if (has('fps','graph')) h += `<canvas data-role="ftgraph" width="320" height="46"></canvas>`;
        if (has('fps','frametime')) h += `<div class="ftline" data-row="fps.frametime"><span class="k">frametime</span> ${val('fps.frametime','ms')}</div>`;
      }
      h += '</div>';

    return h + '</div>';
  }

  function buildMin() {
    let h = '<div class="osd t-min">';
    for (const cat of orderList()) {
      if (cat === 'net') { h += netSeg('line'); continue; }

          h += `<div class="line"><span class="k fp">FPS</span><span class="v big" data-role="fps.fps">–</span>${has('fps','frametime')?`<span class="sub">${val('fps.frametime','ms')}</span>`:''}</div>`;

      if (has(cat,'load')) parts.push(`<span class="sub">${val(cat+'.load','%')}</span>`);

  function buildBar() {
    let h = '<div class="osd t-bar">';

  function buildNeon() {
    let h = '<div class="osd t-neon">';

      else if (has('fps','frametime')) h += `<div class="stats"><span class="row" data-row="fps.frametime"><span class="k">frametime</span> ${val('fps.frametime','ms')}</span></div>`;

  function buildStrip() {
    let h = '<div class="osd t-strip">';

  function buildTiles() {
    let h = '<div class="osd t-tiles">';
    for (const cat of orderList()) {
      if (cat === 'net') { h += netSeg('tile'); continue; }
      if (cat === 'fps') {
