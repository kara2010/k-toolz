        h += `<div class="tile fps"><div class="cap">FPS</div>`;
        h += has('fps','fps') ? `<div class="num"><span data-role="fps.fps">–</span></div>` : `<div class="num">–</div>`;
        if (has('fps','frametime')) h += `<div class="sub" data-row="fps.frametime"><span data-role="fps.frametime">–</span> ms</div>`;
        h += `</div>`;
        continue;
      }
      if (!catList(cat).length) continue;
      h += `<div class="tile ${cat==='gpu'?'nv':'amd'}"><div class="cap" data-role="${cat}.name">–</div>`;
      h += has(cat,'load') ? `<div class="num">${val(cat+'.load','%')}</div>` : `<div class="num">–</div>`;
      const subs = rowsFor(cat).map(f => `<span data-row="${cat}.${f}">${val(cat+'.'+f, UNIT[f]==='°C'?'°':UNIT[f]==='MHz'?'':'')}<i>${UNIT[f]==='°C'?'':UNIT[f]}</i></span>`);
      if (subs.length) h += `<div class="sub">${subs.join(' · ')}</div>`;
      h += `</div>`;
    }
    return h + '</div>';
  }

  // Ring (Tacho): Umfang 2*pi*r mit r=28 -> 175.9; Fuellgrad setzt paintValues per stroke-dashoffset
  const RING_C = 175.9;
  function ring(role, cat, inner, label) {
    return `<div class="g" style="${gcs(cat)}"><svg viewBox="0 0 68 68"><circle class="trk" cx="34" cy="34" r="28"/><circle class="ring" data-ring="${role}" cx="34" cy="34" r="28" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}"/></svg><div class="gv">${inner}</div><div class="gl">${label}</div></div>`;
  }
  function buildGauge() {
    let h = '<div class="osd t-gauge"><div class="rings">', rest = '';   // Ringe in einer Reihe, Restwerte als eigener Block darunter
    for (const cat of orderList()) {
      if (cat === 'net') { if (catList('net').length) rest += `<div class="rrow"><span class="row grp-net" style="${gcs('net')}"><span class="k">NET</span> ${has('net','rate')?'<span class="v" data-role="net.rate">–</span>':''} ${has('net','total')?'<span class="v" data-role="net.total">–</span>':''}</span></div>`; continue; }
      if (!catList(cat).length) continue;
      if (cat === 'fps') {
        if (has('fps','fps')) h += ring('fps.fps', 'fps', '<span class="v" data-role="fps.fps">–</span>', 'FPS');
        if (has('fps','frametime')) rest += `<div class="rrow"><span class="row" data-row="fps.frametime" style="${gcs('fps')}"><span class="k">ms</span> ${val('fps.frametime','')}</span></div>`;
        continue;
      }
      const nm = cat.toUpperCase();
      if (has(cat,'load')) h += ring(cat + '.load', cat, val(cat + '.load', '%'), nm + ' Last');
      if (has(cat,'temp')) h += ring(cat + '.temp', cat, val(cat + '.temp', '°'), nm + ' Temp');
      const rr = rowsFor(cat).filter(x => x !== 'temp');   // je Gruppe eine zentrierte Zeile unter den Ringen
      if (rr.length) rest += '<div class="rrow">' + rr.map(f => `<span class="row" data-row="${cat}.${f}" style="${gcs(cat)}"><span class="k">${nm} ${LABEL[f]}</span> ${val(cat+'.'+f, UNIT[f])}</span>`).join('') + '</div>';
    }
    h += '</div>';
    if (rest) h += '<div class="rest">' + rest + '</div>';
    return h + '</div>';
  }
  function buildTerm() {
    let h = '<div class="osd t-term">';
    for (const cat of orderList()) {
      if (cat === 'net') { if (catList('net').length) h += `<div class="ln grp-net" style="${gcs('net')}"><span class="k">NET</span> ${has('net','rate')?'<span class="v" data-role="net.rate">–</span>':''} ${has('net','total')?'<span class="v" data-role="net.total">–</span>':''}</div>`; continue; }
      if (!catList(cat).length) continue;
      if (cat === 'fps') { h += `<div class="ln" style="${gcs('fps')}"><span class="k fp">FPS</span> ${has('fps','fps')?'<span class="v" data-role="fps.fps">–</span>':''}${has('fps','frametime')?` <span data-row="fps.frametime">${val('fps.frametime','ms')}</span>`:''}</div>`; continue; }
      h += `<div class="ln" style="${gcs(cat)}"><span class="k ${cat==='gpu'?'nv':'amd'}">${cat.toUpperCase()}</span>`;
      const teile = [];
      if (has(cat,'load')) teile.push(val(cat+'.load','%'));
      for (const f of rowsFor(cat)) teile.push(`<span data-row="${cat}.${f}">${val(cat+'.'+f, UNIT[f])}</span>`);
      h += teile.join('  ') + '</div>';
    }
    return h.replace(/<\/div>$/, '<span class="cur"></span></div>') + '</div>';
  }
  function buildDots() {
    let h = '<div class="osd t-dots">';
    for (const cat of orderList()) {
      if (cat === 'net') { if (catList('net').length && has('net','rate')) h += `<span class="d grp-net" style="${gcs('net')}"><span class="k">NET</span><span class="v" data-role="net.rate">–</span></span>`; continue; }
      if (!catList(cat).length) continue;
      if (cat === 'fps') { h += `<span class="d fps" style="${gcs('fps')}">${has('fps','fps')?'<span class="v" data-role="fps.fps">–</span>':''}${has('fps','frametime')?` <span data-row="fps.frametime">${val('fps.frametime','ms')}</span>`:''}</span>`; continue; }
      h += `<span class="d ${cat==='gpu'?'nv':'amd'}" style="${gcs(cat)}"><span class="k">${cat.toUpperCase()}</span>`;
      if (has(cat,'load')) h += val(cat+'.load','%');
      for (const f of rowsFor(cat)) h += ` <span data-row="${cat}.${f}">${val(cat+'.'+f, UNIT[f]==='°C'?'°':UNIT[f])}</span>`;
      h += '</span>';
    }
    return h + '</div>';
  }
  function buildHud() {
    let h = '<div class="osd t-hud">';
    for (const cat of orderList()) {
      if (cat === 'net') { if (catList('net').length) h += `<div class="m grp-net" style="${gcs('net')}"><span class="tl">NET</span><span></span><span class="val"><span data-role="net.rate">–</span></span>${has('net','total')?'<div class="sub">Σ <span class="v" data-role="net.total">–</span></div>':''}</div>`; continue; }
      if (!catList(cat).length) continue;
      if (cat === 'fps') { h += `<div class="m fps" style="${gcs('fps')}"><span class="tl">FPS</span><span class="ln"><span class="fill" data-role="fps.fpsbar"></span></span><span class="val big">${has('fps','fps')?'<span class="v" data-role="fps.fps">–</span>':'–'}</span>${has('fps','frametime')?`<div class="sub" data-row="fps.frametime">${val('fps.frametime','ms')}</div>`:''}</div>`; continue; }
      h += `<div class="m ${cat==='gpu'?'nv':'amd'}" style="${gcs(cat)}"><span class="tl">${cat.toUpperCase()}</span><span class="ln">${has(cat,'load')?`<span class="fill" data-role="${cat}.loadbar"></span>`:''}</span><span class="val">${has(cat,'load')?val(cat+'.load','%'):'–'}</span>`;
      const subs = rowsFor(cat).map(f => `<span data-row="${cat}.${f}"><span class="k">${LABEL[f]}</span> ${val(cat+'.'+f, UNIT[f])}</span>`);
      if (subs.length) h += `<div class="sub">${subs.join(' · ')}</div>`;
      h += '</div>';
    }
    return h + '</div>';
  }

  const BUILD = { compact: buildCompact, min: buildMin, bar: buildBar, neon: buildNeon, strip: buildStrip, tiles: buildTiles, gauge: buildGauge, term: buildTerm, dots: buildDots, hud: buildHud };

  // ===================== Panel bauen + Frametime-Graph ==================
  let ftCanvas = null, ftCtx = null;
  const FT_MAX = 300; let ftBuf = new Array(FT_MAX).fill(0);
  function drawFtGraph() {
    if (!ftCtx) return;
    const w = ftCanvas.width, h = ftCanvas.height;
    ftCtx.clearRect(0,0,w,h);
    const peak = Math.max(20, ...ftBuf);
    ftCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--fpc').trim() || '#6fe86f'; ftCtx.lineWidth = 1.5; ftCtx.beginPath();   // FPS-Gruppenfarbe
    for (let i = 0; i < FT_MAX; i++) { const x = (i/(FT_MAX-1))*w, y = h-(ftBuf[i]/peak)*(h-2)-1; i?ftCtx.lineTo(x,y):ftCtx.moveTo(x,y); }
    ftCtx.stroke();
  }
  function pushFrametime(ms) { ftBuf.push(ms); if (ftBuf.length > FT_MAX) ftBuf.shift(); drawFtGraph(); }

  function renderPanel() {
    document.body.classList.remove('theme-compact','theme-min','theme-bar','theme-neon','theme-strip','theme-tiles','theme-gauge','theme-term','theme-dots','theme-hud');
    document.body.classList.add('theme-' + cfg.theme);
    panel.innerHTML = (BUILD[cfg.theme] || buildCompact)();
    ftCanvas = panel.querySelector('canvas[data-role="ftgraph"]');
    ftCtx = ftCanvas ? ftCanvas.getContext('2d') : null;
    drawFtGraph();
    lastFpsTextAt = -1e9;   // FPS-Zahl sofort setzen (nicht auf die Drosselung warten; 0 reichte nicht, wenn die Seite juenger als 240 ms war)
    paintValues();       // aktuelle Werte gleich einsetzen
    scheduleBounds();    // neue Panel-Groesse an die Shell (Fenster nachziehen)
  }

  // ===================== Werte einsetzen ================================
  // Feste Nachkommastellen je Feld -> die Textbreite springt nicht, wenn z. B.
  // Watt von 10.1 auf 10 faellt (waere sonst "10" statt "10.0" -> Position ruckt).
  // Zusammen mit tabular-nums (CSS) bleiben auch verschiedene Ziffern gleich breit.
  const VAL_DEC = { load: 0, temp: 0, power: 1, clock: 0, vram: 0, ram: 0, frametime: 1, fps: 0 };
  function fmtVal(field, v) {
    if (v == null) return null;
    const d = VAL_DEC[field];
    if (d == null) return v;
    const n = Number(v);
    return Number.isFinite(n) ? n.toFixed(d) : v;   // Nicht-Zahlen (z. B. "…") unveraendert
  }
  function setRole(role, v) { panel.querySelectorAll(`[data-role="${role}"]`).forEach(el => { el.textContent = (v == null ? '–' : v); }); }
  function setRing(role, anteil) { panel.querySelectorAll(`[data-ring="${role}"]`).forEach(el => { el.setAttribute('stroke-dashoffset', (RING_C * (1 - Math.max(0, Math.min(1, anteil)))).toFixed(1)); }); }
  // Grenzwert-Stufe fuer einen Wert: Warn- und Alarmschwelle getrennt. Hoch ist schlecht (Temperatur, Last):
  // 'warn' ab warn, 'crit' ab crit. Niedrig ist schlecht (FPS): 'warn' unter warn, 'crit' unter crit.
  // Fehlt die Warnschwelle (alte Einstellungen), gilt crit-10 bzw. bei FPS die Haelfte der Warnschwelle als Alarm.
  function limitStufe(v, warn, crit, niedrigIstSchlecht) {
    if (v == null || !cfg.limits || cfg.limits.on === false) return '';
    const n = Number(v); if (!Number.isFinite(n)) return '';
    if (niedrigIstSchlecht) {
      if (!warn) return '';
      const c = (crit && crit < warn) ? crit : warn / 2;   // Alarm muss unter der Warnung liegen, sonst halbe Warnung
      return n < c ? 'crit' : n < warn ? 'warn' : '';
    }
    if (!crit) return '';
    const w = (warn && warn < crit) ? warn : crit - 10;   // Warnung muss unter dem Alarm liegen (alte Einstellungen, Tippfehler), sonst Alarm-10
    return n >= crit ? 'crit' : n >= w ? 'warn' : '';
  }
  function setLimit(role, v, warn, crit, niedrigIstSchlecht) {
    const st = limitStufe(v, warn, crit, niedrigIstSchlecht);
    panel.querySelectorAll(`[data-role="${role}"], [data-ring="${role}"], [data-role="${role}bar"]`).forEach(el => { el.classList.toggle('warn', st === 'warn'); el.classList.toggle('crit', st === 'crit'); });
  }
  function setRow(rowKey, show) { panel.querySelectorAll(`[data-row="${rowKey}"]`).forEach(el => el.classList.toggle('hidden', !show)); }

  let lastFpsTextAt = 0;
  function nowMs() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

  function paintValues() {
    const L = cfg.limits || {};
    // GPU / CPU
    for (const cat of ['gpu','cpu']) {
      const d = data[cat];
      setRole(cat+'.name', d ? d.name : '–');
      setRole(cat+'.brand', d ? d.brand : '');
      for (const f of ['load','temp','power','clock','vram','ram']) {
        const v = d ? d[f] : null;
        setRole(cat+'.'+f, fmtVal(f, v));
        setRow(cat+'.'+f, v != null);            // Zeile aus, wenn Sensor nichts liefert
        if (f === 'load') { const bar = panel.querySelector(`[data-role="${cat}.loadbar"]`); if (bar && v != null) bar.style.width = Math.max(0, Math.min(100, v)) + '%'; }
        if (f === 'load' || f === 'temp') setRing(cat + '.' + f, v == null ? 0 : Number(v) / 100);
      }
      // Grenzwerte: Temperatur und Last ab Warnschwelle gelb, ab Alarmschwelle rot (optional pulsierend)
      // je Wert abschaltbar (gpuTempOn/cpuTempOn/loadOn/fpsOn; fehlt = an): aus -> Wert null -> keine Stufe, Klassen weg
      setLimit(cat + '.temp', (L[cat + 'TempOn'] === false || !d) ? null : d.temp, cat === 'gpu' ? L.gpuTempWarn : L.cpuTempWarn, cat === 'gpu' ? L.gpuTemp : L.cpuTemp, false);
      setLimit(cat + '.load', (L.loadOn === false || !d) ? null : d.load, L.loadWarn, L.load, false);
    }
    // Netz: vorformatierte Texte aus der Shell; ohne laufende Zaehlung Gruppe weg
    {
      const n = data.net;
      panel.querySelectorAll('.grp-net').forEach(el => el.classList.toggle('hidden', !n));
      if (n) { setRole('net.rate', n.rate); setRole('net.total', n.total); }
    }
    if (data.api != null) setRole('gpu.api', data.api);
    // FPS-Zahlen gedrosselt (Graph läuft flüssig separat)
    if (nowMs() - lastFpsTextAt >= 240) {
      lastFpsTextAt = nowMs();
      if (data.fps != null) setRole('fps.fps', fmtVal('fps', data.fps));
      if (data.frametime != null) setRole('fps.frametime', fmtVal('frametime', data.frametime));
      setRow('fps.frametime', data.frametime != null);
      if (data.fps != null) { setRing('fps.fps', Number(data.fps) / 240); const fb = panel.querySelector('[data-role="fps.fpsbar"]'); if (fb) fb.style.width = Math.max(0, Math.min(100, Number(data.fps) / 240 * 100)) + '%'; }
      setLimit('fps.fps', L.fpsOn === false ? null : data.fps, L.fpsMin, L.fpsCrit, true);
    }
  }

  function updateOsd(d) {
    if (!d) return;
    if ('gpu' in d) data.gpu = d.gpu;
    if ('cpu' in d) data.cpu = d.cpu;
    if ('net' in d) data.net = d.net;
    if (d.api != null) data.api = d.api;
    if (d.fps != null) data.fps = d.fps;
    if (d.frametime != null) { data.frametime = d.frametime; pushFrametime(Number(d.frametime)); }
    paintValues();
  }

  // ===================== Config anwenden ================================
  function applyConfig(c) {
    if (!c) return;
    let rebuild = false;
    if (c.theme && c.theme !== cfg.theme) { cfg.theme = c.theme; rebuild = true; }
    if (c.fields) { cfg.fields = c.fields; rebuild = true; }
    if (c.order) { cfg.order = c.order; rebuild = true; }
    if (c.accent) { cfg.accent = c.accent; }
    if (c.palette) cfg.palette = c.palette;
    if (c.colors !== undefined) cfg.colors = c.colors;
    if (c.limits) cfg.limits = Object.assign({}, cfg.limits, c.limits);
    if (c.layout) { cfg.layout = Object.assign({}, cfg.layout, c.layout); applyLayout(); }
    if (c.font !== undefined) { cfg.font = c.font || ''; applyFont(); }
    applyFarben();
    document.body.classList.toggle('lim-pulse', !!(cfg.limits && cfg.limits.on !== false && cfg.limits.pulse !== false));
    if (c.corner) { document.body.classList.remove('pos-tl','pos-tc','pos-tr','pos-bl','pos-bc','pos-br'); document.body.classList.add('pos-' + c.corner); }
    if (c.opacity != null) { cfg.opacity = c.opacity; document.documentElement.style.setProperty('--panel-op', c.opacity); }
    if (rebuild) renderPanel();
    else { paintValues(); scheduleBounds(); }   // Farben/Grenzwerte/Layout sofort anwenden; Ecke/Deckkraft: Fenster nachziehen
    if (editing) renderEditbar(false);   // Live-Edit-Leiste mitziehen (ohne den Slider zu ueberschreiben)
  }

  // Layout-Baukasten als body-Klassen (CSS oben); Form rund/eckig/pille, Leuchten, dicht, Beschriftungen, Einheiten, Symbole, Trenner
  function applyLayout() {
    const l = cfg.layout || {}, b = document.body.classList;
    b.toggle('lay-nolabels', l.labels === false); b.toggle('lay-nounits', l.units === false); b.toggle('lay-icons', !!l.icons);
    b.toggle('lay-nosep', l.sep === false); b.toggle('lay-eckig', l.form === 'eckig'); b.toggle('lay-pille', l.form === 'pille');
    b.toggle('lay-glow', !!l.glow); b.toggle('lay-dense', !!l.dense);
    scheduleBounds();
  }
  // Schriftart: '' = Standard (CSS-Kette bleibt), sonst Familienname mit Consolas-Rueckfall; Panelmasse aendern sich -> neu melden
  function applyFont() {
    const f = (cfg.font || '').replace(/['"\\]/g, '').trim();
    document.body.classList.toggle('font-custom', !!f);
    document.documentElement.style.setProperty('--osd-font', f ? "'" + f + "', Consolas, 'DejaVu Sans Mono', monospace" : 'inherit');
    scheduleBounds();
  }
  // (kein Aufruf beim Laden: Standardwerte stehen schon im CSS; applyConfig setzt alles, sobald die Config kommt)

  // ===================== Klick-Farbmodus ================================
  // Jedes gefaerbte Element traegt im CSS seine Rolle als --cr (nv/amd/fpc/netc = Gruppe, main = Hauptwerte,
  // val = Nebenwerte, lbl = Beschriftungen, unit = Einheiten). Zeigen hebt alle Teile derselben Rolle hervor,
  // Klick liefert die Rolle: in der Reiter-Vorschau (?preview=1) ans Hauptfenster, im Live-Editor an den
  // eigenen Farbwaehler (#ebPick). Kein Element wird einzeln gefaerbt - immer die ganze Rolle.
  const IS_PREVIEW = /[?&]preview=1/.test(location.search);
  const CR_LABEL = { nv: 'GPU', amd: 'CPU', fpc: 'FPS', netc: 'Netz', main: 'Hauptwerte', val: 'Nebenwerte', lbl: 'Beschriftungen', unit: 'Einheiten' };
  const CR_AUTO = ['main', 'lbl', 'unit'];   // Rollen ohne Palettenwert: '' = Design-Standard
  const crTip = document.getElementById('crTip');
  let crMode = false, crHl = '';
  function crOf(el) { return el && el.nodeType === 1 ? (getComputedStyle(el).getPropertyValue('--cr').trim() || '') : ''; }
  function crLeaf(el) { return el.matches('.fill, .ring') || [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()); }
  function crHighlight(role) {
    if (role === crHl) return;
    crHl = role;
    panel.querySelectorAll('.cr-hl').forEach(e => e.classList.remove('cr-hl'));
    if (!role) return;
    for (const el of panel.querySelectorAll('*')) if (crOf(el) === role && crLeaf(el)) el.classList.add('cr-hl');
  }
  function rgbToHex(c) { const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c || ''); return m ? '#' + [m[1], m[2], m[3]].map(x => (+x).toString(16).padStart(2, '0')).join('') : ''; }
  // aktuelle Farbe einer Rolle: aus der Palette/eigenen Farben, sonst (Auto-Rollen) die gerade gerenderte Farbe des Elements
  function crColor(role, el) { const p = farben(), v = p[role]; if (/^#[0-9a-fA-F]{6}$/.test(v || '')) return { color: v, auto: false }; return { color: rgbToHex(getComputedStyle(el).color) || '#ffffff', auto: CR_AUTO.includes(role) }; }
  function crSet(on) { crMode = !!on; document.body.classList.toggle('cmode', crMode); if (!crMode) { crHighlight(''); crTip.style.display = 'none'; ebPickClose(false); } }
  panel.addEventListener('mousemove', e => {
    if (!crMode) return;
    const role = crOf(e.target);
    crHighlight(role);
    if (!role) { crTip.style.display = 'none'; return; }
    crTip.innerHTML = CR_LABEL[role] + '<small>Klick = Farbe wählen</small>';
    crTip.style.display = 'block';
    const x = Math.min(e.clientX + 16, window.innerWidth - crTip.offsetWidth - 8), y = Math.min(e.clientY + 18, window.innerHeight - crTip.offsetHeight - 8);
    crTip.style.left = x + 'px'; crTip.style.top = y + 'px';
  });
  panel.addEventListener('mouseleave', () => { if (crMode) { crHighlight(''); crTip.style.display = 'none'; } });
  panel.addEventListener('click', e => {
    if (!crMode) return;
    const role = crOf(e.target); if (!role) return;
    e.preventDefault(); e.stopPropagation();
    const c = crColor(role, e.target);
    if (IS_PREVIEW) { window.parent.postMessage({ t: 'osd-pick', key: role, label: CR_LABEL[role], color: c.color, auto: c.auto, x: e.clientX, y: e.clientY }, '*'); return; }
    ebPickOpen(role, c, e.clientX, e.clientY);
  });

  // --- Farbwaehler des Live-Editors (Fenster im Spiel; die Reiter-Vorschau nutzt den Waehler des Hauptfensters) ---
  const PK_GENERIC = ['#ffffff', '#d0d4d8', '#9aa0aa', '#6f7688', '#ffe100', '#74e857', '#4bd6ff', '#ff8a1e', '#c79bff', '#ff4d4d'];
  function hexToHsv(hex) {
    const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0;
    if (d) { h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
    return { h, s: mx ? d / mx : 0, v: mx };
  }
  function hsvToHex(h, s, v) { const f = n => { const k = (n + h / 60) % 6; const c = v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); }; return '#' + f(5) + f(3) + f(1); }
  let pk = null;   // { role, hsv, orig (colors-Objekt vor dem Oeffnen), origPal, sent }
  function ebPickEl() {
    let el = document.getElementById('ebPick'); if (el) return el;
    el = document.createElement('div'); el.id = 'ebPick';
    el.innerHTML = '<div class="pk-title"><span class="pk-name"></span><small>alle Teile dieser Art</small></div>'
      + '<div class="pk-sv"><div class="pk-dot"></div></div><div class="pk-hue"><div class="pk-hd"></div></div>'
      + '<div class="pk-row"><span class="pk-prev"></span><input class="pk-hex" maxlength="7" spellcheck="false"><button type="button" class="pk-std"></button></div>'
      + '<div class="pk-chips"></div><button type="button" class="pk-ok">Fertig</button>';
    document.body.appendChild(el);
    const sv = el.querySelector('.pk-sv'), hue = el.querySelector('.pk-hue'), hex = el.querySelector('.pk-hex');
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const normHex = t => { t = t.trim().toLowerCase(); if (!t.startsWith('#')) t = '#' + t; return /^#[0-9a-f]{6}$/.test(t) ? t : null; };
    function dragOn(area, fn) {
      area.addEventListener('pointerdown', e => { area.setPointerCapture(e.pointerId); fn(e, true); e.preventDefault(); e.stopPropagation(); });
      area.addEventListener('pointermove', e => { if (area.hasPointerCapture(e.pointerId)) fn(e, true); });
      area.addEventListener('pointerup', e => { area.releasePointerCapture(e.pointerId); fn(e, false); });
    }
    dragOn(sv, (e, live) => { const r = sv.getBoundingClientRect(); pkSet({ s: clamp((e.clientX - r.left) / r.width, 0, 1), v: clamp(1 - (e.clientY - r.top) / r.height, 0, 1) }, live); });
    dragOn(hue, (e, live) => { const r = hue.getBoundingClientRect(); pkSet({ h: clamp((e.clientX - r.left) / r.width, 0, 0.9999) * 360 }, live); });
    hex.addEventListener('input', () => { const t = normHex(hex.value); if (t) { pk.hsv = hexToHsv(t); pkApply(true); } });
    hex.addEventListener('change', () => { const t = normHex(hex.value); if (t) { pk.hsv = hexToHsv(t); pkApply(false); } else pkPaint(); });
    el.querySelector('.pk-std').addEventListener('click', () => {   // Auto-Rollen: zurueck auf Design-Standard; Gruppen/Nebenwerte: Standardpalette
      const c = Object.assign({}, cfg.colors || {});
      if (CR_AUTO.includes(pk.role)) delete c[pk.role]; else c[pk.role] = PALETTES.standard[pk.role];
      cfg.colors = c; applyFarben(); pk.hsv = hexToHsv(crColor(pk.role, panel).color); pkPaint(); pkSend();
    });
    el.querySelector('.pk-chips').addEventListener('click', e => { const c = e.target.closest('.pk-chip'); if (c) { pk.hsv = hexToHsv(c.dataset.c); pkApply(false); } });
    el.querySelector('.pk-ok').addEventListener('click', () => ebPickClose(false));
    el.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); ebPickClose(true); } else if (e.key === 'Enter' && e.target !== hex) { e.preventDefault(); ebPickClose(false); } });
    el.addEventListener('pointerdown', e => e.stopPropagation());   // Panel-Drag/Klick nicht ausloesen
    el.addEventListener('wheel', e => e.stopPropagation());
    return el;
  }
  function pkPaint() {
    const el = ebPickEl(), { h, s, v } = pk.hsv, c = hsvToHex(h, s, v);
    el.querySelector('.pk-sv').style.background = 'linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(' + h + ' 100% 50%))';
    const dot = el.querySelector('.pk-dot'); dot.style.left = (s * 100) + '%'; dot.style.top = ((1 - v) * 100) + '%';
    el.querySelector('.pk-hd').style.left = (h / 360 * 100) + '%';
    el.querySelector('.pk-prev').style.background = c;
    const hex = el.querySelector('.pk-hex'); if (document.activeElement !== hex) hex.value = c;
  }
  function pkSet(p, live) { Object.assign(pk.hsv, p); pkApply(live); }
  function pkApply(live) {   // Farbe sofort ins Overlay (eigene Palette), beim Loslassen an die Shell
    const c = hsvToHex(pk.hsv.h, pk.hsv.s, pk.hsv.v);
    cfg.colors = Object.assign({}, PALETTES[pk.origPal] || PALETTES.standard, cfg.colors || {}, { [pk.role]: c }); cfg.palette = 'eigen';
    delete cfg.colors.accent;
    applyFarben(); pkPaint(); renderEditbar(false);
    if (!live) pkSend();
  }
  function pkSend() { pk.sent = true; if (ipcRenderer) ipcRenderer.invoke('osd-edit-colors', { palette: cfg.palette, colors: cfg.colors }); }
  function ebPickOpen(role, c, x, y) {
    const el = ebPickEl();
    if (pk) ebPickClose(false);
    // Start aus einer festen Palette: deren Farben werden die Basis der eigenen Farben (sonst spraengen alle anderen Rollen auf Standard)
    const basis = cfg.palette === 'eigen' ? (cfg.colors || {}) : Object.assign({}, PALETTES[cfg.palette] || PALETTES.standard);
    delete basis.accent;
    pk = { role, hsv: hexToHsv(c.color), orig: cfg.colors ? JSON.parse(JSON.stringify(cfg.colors)) : null, origPal: cfg.palette, sent: false };
    if (cfg.palette !== 'eigen') cfg.colors = basis;
    el.querySelector('.pk-name').textContent = CR_LABEL[role];
    el.querySelector('.pk-std').textContent = CR_AUTO.includes(role) ? 'Automatisch' : 'Standard';
    const seen = new Set(), list = [];
    for (const p of Object.values(PALETTES)) { const v = p[role]; if (v && !seen.has(v)) { seen.add(v); list.push(v); } }
    for (const v of PK_GENERIC) if (list.length < 10 && !seen.has(v)) { seen.add(v); list.push(v); }
    el.querySelector('.pk-chips').innerHTML = list.map(v => '<button type="button" class="pk-chip" data-c="' + v + '" style="background:' + v + '" title="' + v + '"></button>').join('');
    el.style.display = 'block';
    // neben dem Panel (rechts, sonst links), damit das Overlay beim Faerben sichtbar bleibt; passt beides nicht: am Klickpunkt
    const pr = panel.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    const left = pr.right + 12 + w <= window.innerWidth - 8 ? pr.right + 12 : pr.left - 12 - w >= 8 ? pr.left - 12 - w : x + 14;
    el.style.left = Math.max(8, Math.min(left, window.innerWidth - w - 8)) + 'px';
    el.style.top = Math.max(8, Math.min(y - 40, window.innerHeight - h - 8)) + 'px';
    pkPaint(); el.querySelector('.pk-hex').focus({ preventScroll: true }); el.querySelector('.pk-hex').blur();
  }
  function ebPickClose(revert) {
    if (!pk) return;
    const el = document.getElementById('ebPick');
    if (revert) { cfg.colors = pk.orig; cfg.palette = pk.origPal; applyFarben(); renderEditbar(false); if (pk.sent && ipcRenderer) ipcRenderer.invoke('osd-edit-colors', { palette: cfg.palette, colors: cfg.colors }); }
    if (el) el.style.display = 'none';
    pk = null;
  }
  document.addEventListener('pointerdown', e => { if (pk && !e.target.closest('#ebPick')) ebPickClose(false); }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && crMode && !pk && editing) { crSet(false); renderEditbar(false); } });

  // ===================== Live-Edit + IPC ===============================
  let editing = false, drag = null;
  function setEdit(on) { editing = on; document.body.classList.toggle('edit', on);
    if (on) renderEditbar(true);
    if (!on) { panel.style.left = panel.style.top = panel.style.right = panel.style.bottom = ''; crSet(false); scheduleBounds(); } }

  // --- Live-Edit-Leiste: Design durchschalten, Deckkraft, Werte an/aus ---------
  function renderEditbar(full) {
    const tn = (EB_THEMES.find(t => t[0] === cfg.theme) || EB_THEMES[0])[1];
    document.getElementById('ebThemeName').textContent = tn;
    if (full) document.getElementById('ebOpacity').value = cfg.opacity != null ? cfg.opacity : 0.55;
    // Positions-Knoepfe je Theme: horizontale Themes (Leiste/Kacheln) sitzen mittig
    // oben/unten -> nur oben/unten anbieten; vertikale Themes -> vier Ecken.
    const cur = ['tl','tc','tr','bl','bc','br'].find(c => document.body.classList.contains('pos-' + c)) || 'tl';
    // Sechs Positionen fuer jedes Design (vorher: horizontale Designs nur oben/unten mittig, alle anderen nur Ecken)
    const posSet = [['tl','◤','Oben links'],['tc','▀','Oben mittig'],['tr','◥','Oben rechts'],['bl','◣','Unten links'],['bc','▄','Unten mittig'],['br','◢','Unten rechts']];
    const ebc = document.getElementById('ebCorners');
    ebc.innerHTML = posSet.map(([c, sym, ti]) => `<button class="eb-corner${c === cur ? ' on' : ''}" data-corner="${c}" title="${ti}">${sym}</button>`).join('');
    // Form + Darstellungsschalter spiegeln cfg.layout (Standardwerte wie in applyLayout)
    const lay = cfg.layout || {};
    { const f = cfg.font || '', e = EB_FONTS.find(x => x[0] === f); document.getElementById('ebFontName').textContent = e ? e[1] : f; }
    // Paletten-Chips (drei Gruppenfarben als Streifen) + eigene Farben; Farbmodus-Knopf spiegelt crMode
    document.getElementById('ebPal').innerHTML = EB_PAL.map(([k, nm]) => { const p = PALETTES[k]; return '<button data-pal="' + k + '" class="' + (k === 'eigen' ? 'eigen' : '') + (cfg.palette === k ? ' on' : '') + '" title="' + nm + '">' + (p ? '<span style="background:' + p.nv + '"></span><span style="background:' + p.amd + '"></span><span style="background:' + p.fpc + '"></span>' : '') + '</button>'; }).join('');
    document.getElementById('ebCmode').classList.toggle('on', crMode);
    document.getElementById('ebHint').innerHTML = crMode ? '<b>Klick</b> auf einen Text im Overlay = Farbe f\u00fcr alle Teile dieser Art &nbsp;\u00b7&nbsp; <b>Esc</b> = Farbmodus aus' : '<b>Ziehen</b> = Position &nbsp;\u00b7&nbsp; <b>Mausrad</b> = Gr\u00f6\u00dfe';
    // Schalter ohne Wirkung im aktuellen Design sind gesperrt (LAY_CAPS)
    document.querySelectorAll('#ebForm button').forEach(b => { b.classList.toggle('on', (lay.form || 'rund') === b.dataset.form); b.disabled = !layCan('form'); b.title = b.disabled ? 'In diesem Design ohne Wirkung' : ''; });
    document.querySelectorAll('#ebLay button').forEach(b => { b.classList.toggle('on', ebLayAn(lay, b.dataset.lay)); b.disabled = !layCan(b.dataset.lay); b.title = b.disabled ? 'In diesem Design ohne Wirkung' : ''; });
    // Reihenfolge wie im Panel (orderList) - vorher stand hier stur die
    // Definitionsfolge, der Editor zeigte also eine ANDERE Reihenfolge als das OSD.
    const box = document.getElementById('ebFields');
    box.innerHTML = orderList().filter(cat => EB_FLD[cat]).map(cat => {
      const defs = EB_FLD[cat];
      const lblOf = f => { const d = defs.find(x => x[0] === f); return d ? d[1] : f; };
      const an = (cfg.fields[cat] || []).filter(f => defs.some(d => d[0] === f));
      const aus = defs.map(d => d[0]).filter(f => !an.includes(f));
      const farbe = EB_FARBE[cat] || '#e8eaf2';
      return `<div class="eb-frow" data-cat="${cat}" style="--gc:${farbe}">`
        + `<span class="eb-griff" draggable="true" title="Ganze Gruppe verschieben">⠿</span>`
        + `<span class="eb-grp">${cat.toUpperCase()}</span>`
        + `<span class="eb-toks" data-cat="${cat}">`
        + (an.length
            ? an.map(f => `<button class="eb-chip" draggable="true" data-cat="${cat}" data-f="${f}" title="Ziehen zum Verschieben, Klick blendet aus">`
                + `<span class="pkt">⠿</span>${lblOf(f)}</button>`).join('')
            : `<span class="eb-leer">nichts im Overlay</span>`)
        + aus.map(f => `<button class="eb-chip-aus" data-cat="${cat}" data-f="${f}" title="Ins Overlay aufnehmen">+ ${lblOf(f)}</button>`).join('')
        + `</span></div>`;
    }).join('');
    ebDndWire(box);
  }
  // --- Ziehen im Live-Editor: gleiche Regeln wie im Einstellungs-Board ----------
  // Marken innerhalb ihrer Zeile, ganze Zeilen am Griff. Beim dragover ordnet die
  // Leiste LIVE um; erst das Loslassen schickt den neuen Stand an die Shell.
  let ebDrag = null;
  function ebDndWire(box) {
    box.querySelectorAll('.eb-chip').forEach(el => {
      el.addEventListener('dragstart', e => {
        ebDrag = { el, art: 'tok' }; e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => el.classList.add('eb-zieht'), 0);
      });
      el.addEventListener('dragend', () => ebDropFertig());
    });
    box.querySelectorAll('.eb-griff').forEach(griff => {
      const row = griff.closest('.eb-frow');
      griff.addEventListener('dragstart', e => {
        ebDrag = { el: row, art: 'grp' }; e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setDragImage(row, 20, 12);
        setTimeout(() => row.classList.add('eb-zieht'), 0);
      });
      griff.addEventListener('dragend', () => ebDropFertig());
    });
    box.addEventListener('dragover', e => {
      if (!ebDrag) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      if (ebDrag.art === 'tok') {
        const zone = e.target.closest('.eb-toks');
        if (!zone || zone.dataset.cat !== ebDrag.el.dataset.cat) return;   // nur die eigene Gruppe
        const ueber = e.target.closest('.eb-chip');
        if (!ueber || ueber === ebDrag.el) return;
        const r = ueber.getBoundingClientRect();
        zone.insertBefore(ebDrag.el, e.clientX > r.left + r.width / 2 ? ueber.nextSibling : ueber);
      } else {
        const ueber = e.target.closest('.eb-frow');
        if (!ueber || ueber === ebDrag.el) return;
        const r = ueber.getBoundingClientRect();
        ebDrag.el.parentNode.insertBefore(ebDrag.el, e.clientY > r.top + r.height / 2 ? ueber.nextSibling : ueber);
      }
    });
    box.addEventListener('drop', e => e.preventDefault());
  }
  function ebDropFertig() {
    if (!ebDrag) return;
    ebDrag.el.classList.remove('eb-zieht');
    const box = document.getElementById('ebFields');
    if (ebDrag.art === 'grp') {
      const ord = [...box.querySelectorAll('.eb-frow')].map(r => r.dataset.cat);
      cfg.order = ord;
      if (ipcRenderer) ipcRenderer.invoke('osd-edit-order', ord);
    } else {
      const nf = Object.assign({}, cfg.fields);
      for (const zone of box.querySelectorAll('.eb-toks')) {
        const cat = zone.dataset.cat;
        nf[cat] = [...zone.querySelectorAll('.eb-chip')].map(x => x.dataset.f);
      }
      cfg.fields = nf;
      if (ipcRenderer) ipcRenderer.invoke('osd-edit-fields', nf);
    }
    ebDrag = null;
  }
  function ebStepTheme(dir) {
    const i = EB_THEMES.findIndex(t => t[0] === cfg.theme);
    const ni = ((i < 0 ? 0 : i) + dir + EB_THEMES.length) % EB_THEMES.length;
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-theme', EB_THEMES[ni][0]);
  }
  document.getElementById('ebPrev').addEventListener('click', () => ebStepTheme(-1));
  document.getElementById('ebNext').addEventListener('click', () => ebStepTheme(1));
  function ebStepFont(dir) {   // nicht in der Liste (installierte Schrift aus dem Reiter) -> von 'Standard' aus weiter
    const i = EB_FONTS.findIndex(t => t[0] === (cfg.font || ''));
    const ni = ((i < 0 ? 0 : i) + dir + EB_FONTS.length) % EB_FONTS.length;
    cfg.font = EB_FONTS[ni][0]; applyFont(); renderEditbar(false);   // sofort sichtbar
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-font', EB_FONTS[ni][0]);
  }
  document.getElementById('ebFontPrev').addEventListener('click', () => ebStepFont(-1));
  document.getElementById('ebFontNext').addEventListener('click', () => ebStepFont(1));
  document.getElementById('ebOpacity').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    document.documentElement.style.setProperty('--panel-op', v);   // sofort sichtbar
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-opacity', v);
  });
  document.getElementById('ebFields').addEventListener('click', (e) => {
    const chip = e.target.closest('.eb-chip, .eb-chip-aus'); if (!chip) return;
    const cat = chip.dataset.cat, f = chip.dataset.f;
    const arr = (cfg.fields[cat] || []).slice();
    const idx = arr.indexOf(f);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(f);   // ans ENDE - frueher wurde hier auf die Definitionsreihenfolge
                        // zurueckgeworfen, was jede selbst gesetzte Anordnung zerstoerte,
                        // sobald man im Editor einen Wert an- oder abschaltete.
    const nf = Object.assign({}, cfg.fields, { [cat]: arr });
    cfg.fields = nf;
    renderEditbar(false);   // Marke wandert sofort zwischen "im Overlay" und "ausgeblendet"
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-fields', nf);
  });
  // Layout-Schalter: labels/units/sep sind standardmaessig AN (nur false schaltet aus), der Rest AUS
  function ebLayAn(l, k) { return ['labels','units','sep'].includes(k) ? l[k] !== false : !!l[k]; }
  function ebSetLayout(patch) {
    cfg.layout = Object.assign({}, cfg.layout, patch);
    applyLayout(); renderEditbar(false);   // sofort sichtbar, Knoepfe nachziehen
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-layout', cfg.layout);   // Shell schreibt osdLayout + zieht beide Fenster nach
  }
  document.getElementById('ebForm').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) ebSetLayout({ form: b.dataset.form }); });
  document.getElementById('ebLay').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const k = b.dataset.lay; ebSetLayout({ [k]: !ebLayAn(cfg.layout || {}, k) }); });
  document.getElementById('ebPal').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    cfg.palette = b.dataset.pal; applyFarben(); renderEditbar(false);
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-palette', cfg.palette);   // Shell schreibt osdPalette, eigene Farben bleiben gespeichert
  });
  document.getElementById('ebPal').addEventListener('mouseover', (e) => { const b = e.target.closest('button'); if (b) applyFarben(b.dataset.pal); });   // Hover zeigt die Palette
  document.getElementById('ebPal').addEventListener('mouseleave', () => applyFarben());
  document.getElementById('ebCmode').addEventListener('click', () => { crSet(!crMode); renderEditbar(false); });
  document.getElementById('ebCorners').addEventListener('click', (e) => {
    const btn = e.target.closest('.eb-corner'); if (!btn) return;
    const corner = btn.dataset.corner;
    document.body.classList.remove('pos-tl','pos-tc','pos-tr','pos-bl','pos-bc','pos-br');
    document.body.classList.add('pos-' + corner);
    renderEditbar(false);   // aktiver Button + Leisten-Seite (via CSS) nachziehen
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-corner', corner);
  });
  panel.addEventListener('pointerdown', (e) => {
    if (!editing || crMode || e.target.closest('#editDone')) return;   // Farbmodus: Klick waehlt Rolle, kein Verschieben
    const r = panel.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    document.body.classList.remove('pos-tl','pos-tc','pos-tr','pos-bl','pos-bc','pos-br');
    panel.style.right = panel.style.bottom = ''; panel.style.margin = '0'; panel.style.transform = 'none';
    panel.style.left = r.left + 'px'; panel.style.top = r.top + 'px';
    try { panel.setPointerCapture(e.pointerId); } catch (er) {}
    e.preventDefault();
  });
  panel.addEventListener('pointermove', (e) => { if (!drag) return; panel.style.left = (e.clientX - drag.dx) + 'px'; panel.style.top = (e.clientY - drag.dy) + 'px'; });
  panel.addEventListener('pointerup', () => {
    if (!drag) return; drag = null;
    const r = panel.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const corner = (cy < window.innerHeight/2 ? 't' : 'b') + (cx < window.innerWidth/3 ? 'l' : cx > window.innerWidth*2/3 ? 'r' : 'c');   // Drittel: links/mittig/rechts
    panel.style.left = panel.style.top = panel.style.margin = panel.style.transform = '';
    document.body.classList.add('pos-' + corner);
    renderEditbar(false);   // Ecken-Button + Leisten-Seite an die neue Position anpassen
    if (ipcRenderer) ipcRenderer.invoke('osd-edit-corner', corner);
  });
  window.addEventListener('wheel', (e) => { if (!editing || e.target.closest('#editbar')) return; e.preventDefault(); if (ipcRenderer) ipcRenderer.invoke('osd-edit-scale', e.deltaY < 0 ? 1 : -1); }, { passive: false });
  document.getElementById('editDone').addEventListener('click', () => { if (ipcRenderer) ipcRenderer.invoke('osd-edit-done'); });

  // Edit-Fenster (?editbg=1): eingefrorener Desktop-Schnappschuss als Hintergrund - sieht aus
  // wie Transparenz, ist aber ein normales interaktives Fenster (echtes Per-Pixel gibt es nur
  // im Composition-ANZEIGE-Overlay; dort ist der Body wie bisher transparent).
  try {
    if (new URLSearchParams(location.search).get('editbg')) {
      // Sofort sichtbar machen, synchron per URL statt ueber das asynchrone 'osd-edit'/
      // body.edit - sonst waere das Edit-Fenster fuer die Dauer dieses Web-Message-Umlaufs
      // kurz unsichtbar (der neue Fade-Start unten setzt opacity:0 nur fuer das Anzeige-
      // Overlay, aber sicherheitshalber schon hier explizit auf sichtbar).
      document.body.style.opacity = '1';
      // WICHTIG: html/body auf volle Hoehe - sonst ist die Hintergrund-Bezugsbox nur so hoch
      // wie der INHALT (Panel) und der Schnappschuss wird in den oberen Streifen gequetscht
      // (User-Befund "Bildschirm nach oben gequetscht"; darunter blieb es schwarz).
      document.documentElement.style.height = '100%';
      document.body.style.height = '100%';
      // Schnappschuss + dezente Abdunkelung: wirkt wie "Desktop leicht gedimmt" (Edit-Fokus).
      document.body.style.background = 'linear-gradient(rgba(8,10,14,.4), rgba(8,10,14,.4)), #000 url(https://data.k-toolz/osd-edit-bg.bmp?v=' + Date.now() + ') 0 0 / 100% 100% no-repeat';
    }
  } catch (e) {}

  // Beispielwerte fuer Reiter-Vorschau und Browser-Demo (keine echten Geraete)
  const DEMO = { gpu: { brand: 'NVIDIA', name: 'GeForce RTX', load: 45, temp: 62, power: 210, clock: 2730, vram: 8420 },
                 cpu: { brand: 'AMD', name: 'Ryzen 9', load: 38, temp: 68, power: 95, clock: 5000, ram: 24560 },
                 fps: 144, frametime: 6.9, api: 'D3D12', net: null };
  function demoTick() { data.fps = 138 + Math.round(Math.random() * 12); data.frametime = +(1000 / data.fps).toFixed(1); data.gpu.load = 40 + Math.round(Math.random() * 20); pushFrametime(data.frametime); paintValues(); }
  let ipcRenderer = null;
  if (!IS_PREVIEW) try { ipcRenderer = require('electron').ipcRenderer; } catch (e) {}
  if (IS_PREVIEW) {
    // -------- Vorschau im Einstellungsreiter (iframe in index.html): Config per postMessage vom Hauptfenster,
    // Beispielwerte, Klick-Farbmodus immer an (Klick meldet die Rolle ans Hauptfenster, das den Farbwaehler oeffnet),
    // Panelmasse ans Hauptfenster (das den Rahmen passend macht). Kein Shell-Kanal: osd-bounds o. ae. gehen hier nie raus.
    document.body.style.opacity = '1';
    data = JSON.parse(JSON.stringify(DEMO));
    window.addEventListener('message', (e) => {
      const m = e.data || {};
      if (m.t === 'cfg' && m.cfg) applyConfig(m.cfg);
      else if (m.t === 'hl') crHighlight(m.key || '');   // Zeigen auf eine Farbkachel im Reiter hebt die Rolle hier hervor
    });
    crSet(true);
    renderPanel();
    const meld = () => { const r = panel.getBoundingClientRect(); window.parent.postMessage({ t: 'osd-size', w: Math.ceil(r.width + 28), h: Math.ceil(r.height + 28) }, '*'); };
    try { new ResizeObserver(meld).observe(panel); } catch (e) {}
    setInterval(demoTick, 600);
    window.parent.postMessage({ t: 'osd-ready' }, '*');
  } else if (ipcRenderer) {
    ipcRenderer.on('osd-data', (e, d) => updateOsd(d));
    ipcRenderer.on('osd-config', (e, c) => applyConfig(c));
    ipcRenderer.on('osd-edit', (e, on) => setEdit(on));
    // Shell nach dem Live-Edit: Hysterese-Gedaechtnis loeschen und die Panel-Masse neu melden
    ipcRenderer.on('osd-remeasure', () => { _lastB = { key: '', w: 0, h: 0 }; scheduleBounds(); });
    // Sanftes Ein-/Ausblenden (osdFadeVisual in main.cpp) per CSS-Opacity statt der an
    // E_NOINTERFACE gescheiterten DComp-Visual3-Opacity. Edit-Fenster (?editbg=1, oben bereits
    // auf opacity:1 gesetzt) bleibt aussen vor - nur das Anzeige-Overlay startet unsichtbar,
    // und zwar genau HIER (im selben Tick, in dem der Listener registriert wird): so kann das
    // erste 'osd-fade'(true) nie auf einen noch fehlenden Listener treffen.
    const isEditBg = !!new URLSearchParams(location.search).get('editbg')
    if (!isEditBg) document.body.style.opacity = '0'
    ipcRenderer.on('osd-fade', (e, on) => {
      if (document.body.classList.contains('edit')) return
      document.body.style.transition = 'opacity ' + (on ? '.26s' : '.11s') + ' linear'
      document.body.style.opacity = on ? '1' : '0'
    })
    renderPanel();
  } else {
    // -------- Demo-Modus (im Browser ohne Electron): Beispielwerte + Theme-Umschalter
    document.body.style.opacity = '1'   // kein Shell-Fade hier -> Default (unsichtbar) sofort aufheben
    data = JSON.parse(JSON.stringify(DEMO));
    renderPanel();
    setInterval(demoTick, 300);
    const themes = ['compact','min','bar','neon','strip','tiles','gauge','term','dots','hud'];
    const sw = document.createElement('div');
    sw.style.cssText = 'position:fixed;top:8px;left:8px;display:flex;gap:6px;font-family:sans-serif;font-weight:400;z-index:99';
    themes.forEach(t => { const b = document.createElement('button'); b.textContent = t; b.style.cssText='padding:5px 10px;border-radius:6px;border:1px solid #444;background:#1a1d24;color:#ddd;cursor:pointer;font-size:12px'; b.onclick = () => applyConfig({ theme: t }); sw.appendChild(b); });
    document.body.appendChild(sw);
    document.body.style.background = 'linear-gradient(158deg,#1d2b24,#0f171d 62%,#101a22)';
  }
</script>
</body>
</html>
